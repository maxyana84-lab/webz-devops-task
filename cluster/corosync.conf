# Corosync 2.x - 3-node cluster, unicast UDP (Docker bridge has no multicast guarantee)
totem {
    version: 2
    cluster_name: webz_cluster
    transport: udpu
    secauth: off
    # Failure detection: node is considered dead after `token` ms without the token
    token: 3000
    interface {
        ringnumber: 0
        bindnetaddr: 172.28.0.0
        mcastport: 5405
    }
}

nodelist {
    node {
        ring0_addr: webz-001
        name: webz-001
        nodeid: 1
    }
    node {
        ring0_addr: webz-002
        name: webz-002
        nodeid: 2
    }
    node {
        ring0_addr: webz-003
        name: webz-003
        nodeid: 3
    }
}

quorum {
    # 3 votes, quorum = 2: the cluster survives the loss of one node
    provider: corosync_votequorum

    # Allow the full failover chain webz-001 -> webz-002 -> webz-003 when nodes
    # fail ONE AFTER ANOTHER (not simultaneously):
    # last_man_standing - after a node has been gone for the window (10 s),
    #   expected_votes is recalculated downwards (3 -> 2)
    # auto_tie_breaker  - in a 50/50 split (1 of 2) the partition holding the
    #   tie-breaker node keeps quorum. "highest" = webz-003 (nodeid 3), the last
    #   node of the failover chain. (Tested on corosync 2.4.3: "lowest" or a list
    #   also count already-dead nodes, so webz-003 would never get quorum.)
    # wait_for_all - on a cold start quorum is granted only once all 3 nodes
    #   were seen together (required by corosync for LMS + ATB, prevents split-brain)
    wait_for_all: 1
    last_man_standing: 1
    last_man_standing_window: 10000
    auto_tie_breaker: 1
    auto_tie_breaker_node: highest
}

logging {
    to_stderr: no
    to_syslog: no
    to_logfile: yes
    logfile: /var/log/corosync/corosync.log
    timestamp: on
}
