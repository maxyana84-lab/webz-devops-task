# Virtual host bound to the floating IP
<VirtualHost 172.28.0.100:80>
    ServerName webz-cluster
    DocumentRoot /var/www/webz
    DirectoryIndex index.html

    # Which cluster node answered (WEBZ_NODE is exported in /etc/apache2/envvars)
    Header always set X-Served-By "${WEBZ_NODE}"

    <Directory /var/www/webz>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/webz_error.log
    CustomLog ${APACHE_LOG_DIR}/webz_access.log combined
</VirtualHost>

# Loopback vhost used only by Pacemaker's apache monitor (server-status)
<VirtualHost 127.0.0.1:80>
    ServerName localhost
    <Location /server-status>
        SetHandler server-status
        Require local
    </Location>
</VirtualHost>
